<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div class="container">
          <div class="header__wrapper">
            <div class="header__logo">
              <img src="src/icons/logo.svg" alt="logo" />
            </div>
            <div class="header__buttons">
              <button class="button button_add">Добавить контакт +</button>
              <button class="button button_filter">Группы</button>
            </div>
          </div>
        </div>
      </header>
      <main class="content">
        <p class="content__placeholder">Список контактов пуст</p>
        <div class="container">
          <div class="content__wrapper">
            <div class="content__item">
              <button class="content__header">
                Друзья
                <span class="content__icon">
                  <svg
                    width="13"
                    height="8"
                    viewBox="0 0 13 8"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M10.8849 0.294998L6.29492 4.875L1.70492 0.294998L0.294922 1.705L6.29492 7.705L12.2949 1.705L10.8849 0.294998Z"
                      fill="black"
                    />
                  </svg>
                </span>
              </button>
              <div class="content__content">
                <div class="content__row">
                  <span>Фамилия Имя Отчество</span>

                  <div class="content__buttons">
                    <span>+7 (XXX) XXX - XX - XX</span>
                    <button class="btn-edit">
                      <svg
                        width="18"
                        height="18"
                        viewBox="0 0 18 18"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          opacity="0.3"
                          d="M0 14.25V18H3.75L14.81 6.94L11.06 3.19L0 14.25ZM17.71 4.04C18.1 3.65 18.1 3.02 17.71 2.63L15.37 0.289998C14.98 -0.100002 14.35 -0.100002 13.96 0.289998L12.13 2.12L15.88 5.87L17.71 4.04V4.04Z"
                          fill="black"
                        />
                      </svg>
                    </button>
                    <button class="btn-delete">
                      <svg
                        width="16"
                        height="20"
                        viewBox="0 0 16 20"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          opacity="0.3"
                          d="M1.66667 17.3889C1.66667 18.55 2.61667 19.5 3.77778 19.5H12.2222C13.3833 19.5 14.3333 18.55 14.3333 17.3889V4.72222H1.66667V17.3889ZM4.26333 9.87333L5.75167 8.385L8 10.6228L10.2378 8.385L11.7261 9.87333L9.48833 12.1111L11.7261 14.3489L10.2378 15.8372L8 13.5994L5.76222 15.8372L4.27389 14.3489L6.51167 12.1111L4.26333 9.87333ZM11.6944 1.55556L10.6389 0.5H5.36111L4.30556 1.55556H0.611111V3.66667H15.3889V1.55556H11.6944Z"
                          fill="black"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
                <div class="content__row">
                  <span>Фамилия Имя Отчество</span>

                  <div class="content__buttons">
                    <span>+7 (XXX) XXX - XX - XX</span>
                    <button class="btn-edit">
                      <svg
                        width="18"
                        height="18"
                        viewBox="0 0 18 18"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          opacity="0.3"
                          d="M0 14.25V18H3.75L14.81 6.94L11.06 3.19L0 14.25ZM17.71 4.04C18.1 3.65 18.1 3.02 17.71 2.63L15.37 0.289998C14.98 -0.100002 14.35 -0.100002 13.96 0.289998L12.13 2.12L15.88 5.87L17.71 4.04V4.04Z"
                          fill="black"
                        />
                      </svg>
                    </button>
                    <button class="btn-delete">
                      <svg
                        width="16"
                        height="20"
                        viewBox="0 0 16 20"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          opacity="0.3"
                          d="M1.66667 17.3889C1.66667 18.55 2.61667 19.5 3.77778 19.5H12.2222C13.3833 19.5 14.3333 18.55 14.3333 17.3889V4.72222H1.66667V17.3889ZM4.26333 9.87333L5.75167 8.385L8 10.6228L10.2378 8.385L11.7261 9.87333L9.48833 12.1111L11.7261 14.3489L10.2378 15.8372L8 13.5994L5.76222 15.8372L4.27389 14.3489L6.51167 12.1111L4.26333 9.87333ZM11.6944 1.55556L10.6389 0.5H5.36111L4.30556 1.55556H0.611111V3.66667H15.3889V1.55556H11.6944Z"
                          fill="black"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="content__item">
              <button class="content__header">
                Коллеги
                <span class="content__icon">
                  <svg
                    width="13"
                    height="8"
                    viewBox="0 0 13 8"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                  >
                    <path
                      d="M10.8849 0.294998L6.29492 4.875L1.70492 0.294998L0.294922 1.705L6.29492 7.705L12.2949 1.705L10.8849 0.294998Z"
                      fill="black"
                    />
                  </svg>
                </span>
              </button>
              <div class="content__content">
                <!-- Контент -->
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="menu-groups">
      <div class="menu-groups__header">
        <div class="menu-groups__title">Группа контактов</div>
        <div class="close">
          <button>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_1894_185)">
                <rect width="24" height="24" rx="6" fill="white" />
                <path
                  opacity="0.3"
                  d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
                  fill="black"
                />
              </g>
              <defs>
                <clipPath id="clip0_1894_185">
                  <rect width="24" height="24" rx="6" fill="white" />
                </clipPath>
              </defs>
            </svg>
          </button>
        </div>
      </div>

      <div class="menu-groups__wrapper">
        <div class="menu-groups__item">
          <input value="Друзья" class="menu-groups__name" />

          <button class="btn-delete">
            <svg
              width="16"
              height="20"
              viewBox="0 0 16 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                opacity="0.3"
                d="M1.66667 17.3889C1.66667 18.55 2.61667 19.5 3.77778 19.5H12.2222C13.3833 19.5 14.3333 18.55 14.3333 17.3889V4.72222H1.66667V17.3889ZM4.26333 9.87333L5.75167 8.385L8 10.6228L10.2378 8.385L11.7261 9.87333L9.48833 12.1111L11.7261 14.3489L10.2378 15.8372L8 13.5994L5.76222 15.8372L4.27389 14.3489L6.51167 12.1111L4.26333 9.87333ZM11.6944 1.55556L10.6389 0.5H5.36111L4.30556 1.55556H0.611111V3.66667H15.3889V1.55556H11.6944Z"
                fill="black"
              />
            </svg>
          </button>
        </div>
        <div class="menu-groups__item">
          <input value="Друзья" class="menu-groups__name" />
          <button class="btn-delete">
            <svg
              width="16"
              height="20"
              viewBox="0 0 16 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                opacity="0.3"
                d="M1.66667 17.3889C1.66667 18.55 2.61667 19.5 3.77778 19.5H12.2222C13.3833 19.5 14.3333 18.55 14.3333 17.3889V4.72222H1.66667V17.3889ZM4.26333 9.87333L5.75167 8.385L8 10.6228L10.2378 8.385L11.7261 9.87333L9.48833 12.1111L11.7261 14.3489L10.2378 15.8372L8 13.5994L5.76222 15.8372L4.27389 14.3489L6.51167 12.1111L4.26333 9.87333ZM11.6944 1.55556L10.6389 0.5H5.36111L4.30556 1.55556H0.611111V3.66667H15.3889V1.55556H11.6944Z"
                fill="black"
              />
            </svg>
          </button>
        </div>

        <div class="menu-groups__buttons">
          <button class="button button_without-bg">Добавить</button>
          <button class="button button_blue-bg">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="menu-add-contact">
      <div class="menu-add-contact__header">
        <div class="menu-groups__title">Добавление контакта</div>
        <div class="close">
          <button>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_1894_185)">
                <rect width="24" height="24" rx="6" fill="white" />
                <path
                  opacity="0.3"
                  d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
                  fill="black"
                />
              </g>
              <defs>
                <clipPath id="clip0_1894_185">
                  <rect width="24" height="24" rx="6" fill="white" />
                </clipPath>
              </defs>
            </svg>
          </button>
        </div>
      </div>

      <div class="menu-add-contact__wrapper">
        <input
          type="text"
          class="menu-add-contact__input"
          placeholder="Введите ФИО"
        />
        <input
          type="text"
          class="menu-add-contact__input"
          placeholder="Введите номер"
        />

        <div class="menu-add-contact__dropdown">
          <div class="menu-add-contact__dropdown-selected">
            <span>Выберите контакт</span>
            <svg
              class="menu-add-contact__dropdown-arrow"
              width="13"
              height="8"
              viewBox="0 0 13 8"
              fill="none"
            >
              <path
                d="M10.8849 0.294998L6.29492 4.875L1.70492 0.294998L0.294922 1.705L6.29492 7.705L12.2949 1.705L10.8849 0.294998Z"
                fill="black"
              />
            </svg>
          </div>
          <div class="menu-add-contact__dropdown-list"></div>
        </div>

        <div class="menu-add-contact__buttons">
          <button class="button button_blue-bg">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="modal">
      <div class="modal__window">
        <div class="close close_modal">
          <button>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g clip-path="url(#clip0_1894_185)">
                <rect width="24" height="24" rx="6" fill="white" />
                <path
                  opacity="0.3"
                  d="M19 6.41L17.59 5L12 10.59L6.41 5L5 6.41L10.59 12L5 17.59L6.41 19L12 13.41L17.59 19L19 17.59L13.41 12L19 6.41Z"
                  fill="black"
                />
              </g>
              <defs>
                <clipPath id="clip0_1894_185">
                  <rect width="24" height="24" rx="6" fill="white" />
                </clipPath>
              </defs>
            </svg>
          </button>
        </div>
        <h2 class="modal__title">Удалить группу?</h2>
        <p class="modal__text">
          Удаление группы повлечёт за собой удаление контактов, связанных с этой
          группой
        </p>
        <div class="modal__buttons">
          <button class="button button_blue-bg">Да, удалить</button>
          <button class="button button_without-bg">Отмена</button>
        </div>
      </div>
    </div>

    <div class="overlay"></div>

    <script type="module" src="/src/ts/main.ts"></script>
  </body>
</html>
